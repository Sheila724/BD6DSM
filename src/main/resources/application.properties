# === Servidor ===
server.port=${PORT:8080}

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === Datasource primario (usado pelo DatabaseConfig.java via @Value) ===
db.primary.host=${DB_PRIMARY_HOST:localhost}
db.primary.port=${DB_PRIMARY_PORT:3306}
db.primary.database=${DB_PRIMARY_DATABASE:aula-db}
db.primary.username=${DB_PRIMARY_USERNAME:root}
db.primary.password=${DB_PRIMARY_PASSWORD:}

# === Replicas: lista separada por virgula no formato host:porta ===
# Exemplo: SEU_IP:3306  ou  host1:3306,host2:3306,host3:3306
db.replicas=${DB_REPLICAS:localhost:3306}
db.replica.database=${DB_REPLICA_DATABASE:aula-db}
db.replica.username=${DB_REPLICA_USERNAME:root}
db.replica.password=${DB_REPLICA_PASSWORD:}
